{% extends 'logistica/base.html' %}

{% block title %}Iniciar Sesión - Emporio Alemán{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0">
                    <i class="fa-solid fa-lock me-2 text-warning"></i>
                    Acceso al Sistema {% if rol_sugerido %}({{ rol_sugerido }}){% endif %}
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus placeholder="Ingresa tu nombre de usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Volver al Inicio</a>
                    </div>
                </form>
                <hr class="my-4">
                <div class="text-center small">
                    ¿Eres cliente nuevo? <a href="{% url 'registro_cliente' %}" class="fw-bold text-success">Registra tu local aquí</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
